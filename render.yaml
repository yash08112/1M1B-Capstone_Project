services:
  - type: web
    name: campus-water-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train_and_save_model.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
